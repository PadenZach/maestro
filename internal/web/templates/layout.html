{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · maestro</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/footer.css">
  <link rel="stylesheet" href="/static/application.css">
  <link rel="stylesheet" href="/static/aggregates.css">
  <link rel="stylesheet" href="/static/workflow-flow.css">
  <link rel="stylesheet" href="/static/workflow-filters.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/console.js" defer></script>
  <script src="/static/application.js" defer></script>
  <script src="/static/workflow-flow.js" defer></script>
  <script src="/static/workflow-filters.js" defer></script>
  <script src="/static/alpine.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">maestro</div>
    <div class="application-status" aria-label="{{.Status.Label}}">
      <span class="status-dot status-{{.Status.State}}" aria-hidden="true"></span>
      <span>Applications online</span>
    </div>
  </header>

  <nav class="breadcrumb">
    {{range $i, $c := .Crumbs}}{{if $i}}<span class="sep">›</span>{{end}}{{if $c.Href}}<a href="{{$c.Href}}">{{$c.Label}}</a>{{else}}<span class="current">{{$c.Label}}</span>{{end}}{{end}}
  </nav>

  <main class="content">
    {{template "content" .}}
  </main>
  <footer class="site-footer">
    <span>Maestro <span class="mono" aria-label="Maestro version">{{maestroVersion}}</span></span>
    <a href="https://opensource.org/license/mit">MIT License</a>
    <span>Not affiliated with DBOS, Inc. in any way.</span>
  </footer>
</body>
</html>{{end}}
