# Run `mise tasks` to list tasks.

[tools]
go = "1.26.8"

[env]
MAESTRO_PORT = "8090"

[tasks.dev]
description = "Run the development server on http://127.0.0.1:8090"
run = 'go run ./cmd/maestro --listen "127.0.0.1:$MAESTRO_PORT"'

[tasks.fmt]
description = "Format Go source"
run = "gofmt -w cmd internal dev/tests/container"

[tasks.check]
description = "Check formatting, build, vet, Staticcheck and run Go tests"
run = [
  '''
set -eu
files="$(gofmt -l cmd internal dev/tests/container)"
if [ -n "$files" ]; then
  printf 'Run mise run fmt for:\n%s\n' "$files"
  exit 1
fi
''',
  "go build ./...",
  "go vet ./...",
  "go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...",
  "go test -race -count=1 ./...",
]

[tasks.build]
description = "Build and load the native image into Docker"
shell = "bash -euo pipefail -c"
run = '''
docker buildx build --load --tag "${IMAGE:-maestro:local}" \
  --build-arg "VERSION=${VERSION:-$(git describe --tags --always --dirty)}" \
  --build-arg "REVISION=$(git rev-parse HEAD)" \
  --build-arg "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" .
'''

[tasks."image:scan"]
description = "Scan IMAGE (default maestro:local) for HIGH/CRITICAL vulnerabilities"
run = 'trivy image --scanners vuln --no-progress --severity HIGH,CRITICAL --exit-code 1 "${IMAGE:-maestro:local}"'
tools = { trivy = "0.74.0" }

[tasks."image:publish"]
description = "Push a candidate to IMAGE_REPOSITORY, scan both platforms, then promote it"
shell = "bash -euo pipefail -c"
run = '''
repository="$(printf '%s' "${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY to the registry image name}" | tr '[:upper:]' '[:lower:]')"
revision="$(git rev-parse HEAD)"
candidate="candidate-$revision-${GITHUB_RUN_ID:-$(date +%s)}-${GITHUB_RUN_ATTEMPT:-1}"
scratch="$(mktemp -d)"
trap 'rm -rf "$scratch"' EXIT
docker buildx build --push --platform linux/amd64,linux/arm64 \
  --tag "$repository:$candidate" --sbom=true --provenance=mode=min \
  --build-arg "VERSION=${VERSION:-$(git describe --tags --always --dirty)}" \
  --build-arg "REVISION=$revision" \
  --build-arg "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
  --metadata-file "$scratch/metadata.json" .
digest="$(jq -er '."containerimage.digest"' "$scratch/metadata.json")"
for arch in amd64 arm64; do
  IMAGE="$repository@$digest" TRIVY_PLATFORM="linux/$arch" TRIVY_IMAGE_SRC=remote \
    mise run image:scan
done
docker buildx imagetools create --tag "$repository:${IMAGE_TAG:-sha-$revision}" "$repository@$digest"
'''
tools = { jq = "1.8.1" }

[tasks."image:test"]
description = "Test the container's HTTP endpoints, shutdown and security settings"
run = "python3 -B dev/tests/container/smoke.py"

[tasks.scan]
description = "Scan Go dependencies with Trivy (fail on HIGH/CRITICAL)"
shell = "bash -euo pipefail -c"
run = '''
scratch="$(mktemp -d)"
trap 'rm -rf "$scratch"' EXIT
cp go.mod go.sum "$scratch/"
trivy fs --scanners vuln --no-progress --severity HIGH,CRITICAL --exit-code 1 "$scratch"
'''
tools = { trivy = "0.74.0" }

[tasks."sdk:test"]
description = "Test latest stable DBOS Python 2.x and 3.x (or DBOS_SDK_MAJOR)"
run = "python3 -B dev/tests/python/latest.py"
tools = { uv = "0.12.21" }

[tasks."ci:lint"]
description = "Validate GitHub Actions workflows"
run = "actionlint"
tools = { actionlint = "1.7.12" }
