# Run `mise tasks` to list tasks.

[tools]
go = "1.26.8"

[env]
MAESTRO_PORT = "8090"

[tasks.dev]
description = "Run the development server on http://127.0.0.1:8090"
run = 'go run ./cmd/maestro --listen "127.0.0.1:$MAESTRO_PORT"'

[tasks.fmt]
description = "Format Go source"
run = "gofmt -w cmd internal docs/reference dev/tests/container"

[tasks.check]
description = "Check formatting, build, vet, Staticcheck and run all local tests"
run = [
  '''
set -eu
files="$(gofmt -l cmd internal docs/reference dev/tests/container)"
if [ -n "$files" ]; then
  printf 'Run mise run fmt for:\n%s\n' "$files"
  exit 1
fi
''',
  "go build ./...",
  "go vet ./...",
  "go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...",
  "go test -race -count=1 ./...",
  "python3 -B -m unittest discover -s dev/tests/tooling -v",
  "python3 -B -I -S -m unittest discover -s dev/tests -p test_maestro_connection.py -v",
  "python3 -B -I -S -m unittest discover -s dev/tests/acceptance -p 'test_*.py' -v",
]

[tasks.build]
description = "Build and scan both Linux platforms, then load maestro:local into Docker"
run = "python3 -B dev/oci.py build"
tools = { trivy = "0.74.0", oras = "1.3.4" }

[tasks."image:publish"]
description = "Publish the scanned multi-platform image to GHCR"
run = "python3 -B dev/oci.py publish"
tools = { oras = "1.3.4" }

[tasks."image:load"]
description = "Load the verified native image into Docker as maestro:local"
run = "python3 -B dev/oci.py load"

[tasks."image:test"]
description = "Test the container's HTTP endpoints, shutdown and security settings"
run = "python3 -B dev/tests/container/smoke.py"

[tasks.scan]
description = "Scan Go dependencies with Trivy (fail on HIGH/CRITICAL)"
run = "python3 -B dev/oci.py scan"
tools = { trivy = "0.74.0" }

[tasks."sdk:test"]
description = "Test latest stable DBOS Python 2.x and 3.x (or DBOS_SDK_MAJOR)"
run = "python3 -B dev/tests/python/latest.py"
tools = { uv = "0.12.21" }

[tasks."ci:lint"]
description = "Validate GitHub Actions workflows"
run = "actionlint"
tools = { actionlint = "1.7.12" }
