name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - run: mise run check
      - run: mise run ci:lint
      - run: mise run scan
      - id: version
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          version="$(cat VERSION)"
          previous="$version"
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            previous="$(git show "$BASE_SHA:VERSION")"
          fi
          release=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main && "$version" != "$previous" ]]; then
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  sdk:
    if: github.ref == 'refs/heads/main'
    name: SDK ${{ matrix.dbos == '2' && '2.31.x' || '3.x' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dbos: ['2', '3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - run: mise run sdk:test
        env:
          DBOS_SDK_MAJOR: ${{ matrix.dbos }}

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      repository: ${{ steps.build.outputs.repository }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Build candidate
        id: build
        env:
          IMAGE_REPOSITORY: ${{ vars.GHCR_IMAGE || format('ghcr.io/{0}', github.repository) }}
        run: |
          repository="${IMAGE_REPOSITORY,,}"
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --tag "$repository:candidate-$GITHUB_SHA" --sbom=true --provenance=mode=min \
            --build-arg "VERSION=$(cat VERSION)" --build-arg "REVISION=$GITHUB_SHA" \
            --build-arg MODIFIED=false --build-arg "CREATED=$(git show -s --format=%cI HEAD)" \
            --metadata-file "$RUNNER_TEMP/image.json" .
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "digest=$(jq -r '.["containerimage.digest"]' "$RUNNER_TEMP/image.json")" >> "$GITHUB_OUTPUT"

  image-test:
    needs: [checks, image]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      IMAGE: ${{ needs.image.outputs.repository }}@${{ needs.image.outputs.digest }}
      EXPECTED_VERSION: ${{ needs.checks.outputs.version }}
      EXPECTED_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - run: docker pull "$IMAGE"
      - run: mise run image:scan
      - run: mise run image:test

  publish:
    needs: [checks, image, image-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: publish-${{ needs.checks.outputs.release == 'true' && needs.checks.outputs.version || github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_REPOSITORY: ${{ needs.image.outputs.repository }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      RELEASE_VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        if: needs.checks.outputs.release == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Tag tested image by commit
        run: docker buildx imagetools create --tag "$IMAGE_REPOSITORY:sha-$GITHUB_SHA" "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
      - run: mise run package
        if: needs.checks.outputs.release == 'true'
      - name: Publish VERSION release
        if: needs.checks.outputs.release == 'true'
        run: |
          tag="v$RELEASE_VERSION"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi
          release="$(gh release list --limit 1000 --json tagName,isDraft --jq ".[] | select(.tagName == \"$tag\") | .isDraft")"
          if [[ "$release" == false ]]; then
            echo "$tag is already published"
            exit 0
          fi
          if [[ -z "$release" ]]; then
            options=()
            [[ "$RELEASE_VERSION" != *-* ]] || options+=(--prerelease)
            gh release create "$tag" --verify-tag --draft --target "$GITHUB_SHA" --title "$tag" \
              --generate-notes "${options[@]}" dist/release/*
          else
            gh release upload "$tag" --clobber dist/release/*
          fi
          docker buildx imagetools create --tag "$IMAGE_REPOSITORY:$RELEASE_VERSION" "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          gh release edit "$tag" --draft=false
      - name: Verify installation through mise
        if: needs.checks.outputs.release == 'true'
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise exec "github:${GITHUB_REPOSITORY}@${RELEASE_VERSION}" -- maestro --help
