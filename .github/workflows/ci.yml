name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: mise run check
      - run: mise run ci:lint
      - run: mise run scan

  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dbos: ['2', '3']
    env:
      DBOS_SDK_MAJOR: ${{ matrix.dbos }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: mise run sdk:test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && !env.ACT
        with:
          name: sdk-${{ matrix.dbos }}-versions
          path: dist/sdk-${{ matrix.dbos }}.json
          if-no-files-found: error

  image:
    needs: [checks, sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Install image conversion tools
        run: sudo apt-get update && sudo apt-get install -y skopeo jq
      - run: mise run build
      - run: mise run image:test
      - name: Publish image to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_IMAGE: ${{ vars.GHCR_IMAGE }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: mise run image:publish
